name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  # Decides whether this push is a release at all.
  #
  # This workflow fires on EVERY push to main, but main also receives ordinary
  # commits. Previously the version check ended in `exit 1` on anything that was
  # not a release/* or hotfix/* merge, so routine work left a red run behind -
  # every push to main since March. Not being a release is a normal outcome, so
  # it now reports `is-release=false` and the rest of the workflow skips, which
  # is how the shared pipelines already treat their `is-main-merge` gate.
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            IS_RELEASE="true"
            echo "Manual dispatch for version $VERSION"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Commit message: $COMMIT_MSG"

            # Matches "Merge branch 'release/X.Y.Z'" and
            # "Merge pull request ... from .../hotfix/X.Y.Z"
            if [[ "$COMMIT_MSG" =~ (release|hotfix)/([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VERSION="${BASH_REMATCH[2]}"
              IS_RELEASE="true"
              echo "Detected ${BASH_REMATCH[1]} version: $VERSION"
            else
              VERSION=""
              IS_RELEASE="false"
              echo "Not a release/* or hotfix/* merge - nothing to release"
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT

  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    needs: extract-version
    if: needs.extract-version.outputs.is-release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag v${{ needs.extract-version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changelog
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to CHANGELOG.md"
          else
            git commit -m "docs: update CHANGELOG.md for v${VERSION}"
            git push origin main
            echo "✅ Updated CHANGELOG.md for v${VERSION}"
          fi

  create-git-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: [extract-version, update-changelog]
    if: needs.extract-version.outputs.is-release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create and push tag
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "v${VERSION}" -m "Release version ${VERSION}"
          git push origin "v${VERSION}"
          echo "✅ Created and pushed tag: v${VERSION}"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-version, update-changelog, create-git-tag]
    if: needs.extract-version.outputs.is-release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"

          # Extract the section for this version from CHANGELOG.md
          awk "/## \[${VERSION}\]/,/## \[/" CHANGELOG.md | sed '1d;$d' > release-notes.md

          if [ -s release-notes.md ]; then
            echo "✅ Extracted changelog for v${VERSION}"
            cat release-notes.md
          else
            echo "⚠️ No changelog found for v${VERSION}, using default message"
            echo "Release version ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: v${{ needs.extract-version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true

  merge-to-develop:
    name: Merge main to develop
    runs-on: ubuntu-latest
    needs: [extract-version, update-changelog, create-git-tag, create-github-release]
    if: needs.extract-version.outputs.is-release == 'true' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Merging main into develop..."
          git merge origin/main -m "chore: merge main into develop after release v${VERSION}"
          git push origin develop
          echo "✅ Successfully merged main into develop"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [extract-version, update-changelog, create-git-tag, create-github-release, merge-to-develop]
    if: always() && needs.extract-version.outputs.is-release == 'true'
    steps:
      - name: Generate summary
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"

          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Changelog Update | ${{ needs.update-changelog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Create Git Tag | ${{ needs.create-git-tag.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Create GitHub Release | ${{ needs.create-github-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Merge to develop | ${{ needs.merge-to-develop.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.update-changelog.result }}" == "success" && \
                "${{ needs.create-git-tag.result }}" == "success" && \
                "${{ needs.create-github-release.result }}" == "success" && \
                "${{ needs.merge-to-develop.result }}" == "success" ]]; then
            echo "✅ Release v${VERSION} completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Released Artifacts:" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) updated" >> $GITHUB_STEP_SUMMARY
            echo "- 🏷️ Git tag: [\`v${VERSION}\`](https://github.com/${{ github.repository }}/releases/tag/v${VERSION})" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}) created" >> $GITHUB_STEP_SUMMARY
            echo "- 🔀 Merged back to develop" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Release failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
