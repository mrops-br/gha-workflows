name: Cleanup Container Images

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE WAS REWRITTEN
#
# The previous version used actions/delete-package-versions in TWO independent
# passes over the same package: one preserved by tag (protect-semver,
# custom-ignore-pattern) and another deleted everything untagged
# (delete-only-untagged-versions: true, min-versions-to-keep: 0).
#
# In a multi-architecture image ONLY THE INDEX carries the tag. The per-platform
# manifests are package versions with no tag at all — that is OCI by design. So
# the second pass deleted exactly the children the first believed it was
# protecting, leaving every tag pointing at nothing.
#
# Measured against ghcr on 2026-08-25, this had already destroyed EVERY image in
# all six packages: runner-base tags latest/0/0.2/0.2.9 (all covered by
# protect-semver) and dev-latest on petflow-api, petflow-ui, testing-otlp-api,
# testing-throttling-api and auth-keycloak. Production images were protected and
# destroyed at the same time.
#
# The defect was STRUCTURAL: two passes that cannot see each other. There was no
# parameter to tune. The fix is a single pass by an action that resolves the
# index before deciding — dataaxiom/ghcr-cleanup-action builds its candidate set
# with initFilterSet(), which removes every child manifest and every referrer
# from consideration, so "untagged" can only ever mean a genuine top-level
# orphan. That property is the whole reason for the swap.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Package name on ghcr, without the owner'
        required: true
        type: string
      owner:
        description: 'Package owner. Empty means the calling repository owner'
        required: false
        type: string
        default: ''
      keep-n:
        description: 'How many images to keep in EACH set (dev and pr), newest first'
        required: false
        type: number
        default: 3
      older-than:
        description: 'Nothing is deleted before this age. Applies to every step'
        required: false
        type: string
        default: '14 days'
      exclude-tags:
        # No nested quantifier: the action rejects `(\.\d+)*` with a ReDoS
        # heuristic. `[0-9][0-9.]*` covers 0, 0.2, 0.2.9 and v1.2.3 just the
        # same, with a single quantifier.
        description: 'Regex of untouchable tags. Takes priority over every other rule'
        required: false
        type: string
        default: '^(latest|dev-latest|v?[0-9][0-9.]*)$'
      repair-broken-images:
        description: 'Also delete already-broken indexes. DESTROYS TAGS - see the repair steps'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner'
        required: false
        type: string
        default: 'ubuntu-latest'
      dry-run:
        description: 'Only report what would be deleted, delete nothing'
        required: false
        type: boolean
        default: false
      log-level:
        description: 'error | warn | info | debug'
        required: false
        type: string
        default: 'info'

jobs:
  cleanup:
    name: Cleanup Images
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      # ── Retention ───────────────────────────────────────────────────────────
      # Two steps because keep-n-tagged counts within the set delete-tags
      # selects. In a single step, "keep three" would keep the three newest
      # across dev AND pr combined, which in practice deletes every pr image
      # whenever three develop builds are recent.
      #
      # The two sets are disjoint (dev-* and pr-*), so this is still a coherent
      # reading of the graph — unlike the "tagged versus untagged" split that
      # broke everything.
      - name: Retention - develop builds
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          use-regex: true
          # 7 to 40 hex: the real tags carry the full commit sha. The previous
          # pattern demanded exactly seven and therefore never matched anything.
          delete-tags: '^dev-[0-9a-f]{7,40}$'
          exclude-tags: ${{ inputs.exclude-tags }}
          keep-n-tagged: ${{ inputs.keep-n }}
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Retention - pull request builds
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          use-regex: true
          delete-tags: '^pr-[0-9]+$'
          exclude-tags: ${{ inputs.exclude-tags }}
          keep-n-tagged: ${{ inputs.keep-n }}
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      # ── Integrity ───────────────────────────────────────────────────────────
      # Everything here only ever removes something that carries no tag:
      #
      #   delete-untagged         top-level images with zero tags. Safe only
      #                           because initFilterSet() has already removed
      #                           every child manifest from the candidate set.
      #   delete-orphaned-images  cosign sha256-*.sig entries whose subject no
      #                           longer exists. These are pure litter.
      #
      # validate re-reads the package afterwards and warns for every referenced
      # digest that is missing. It does not delete. It is the tripwire that
      # would catch this file repeating the mistake it came to fix, and it is
      # what proved the six packages were already destroyed.
      - name: Integrity - untagged images and orphaned signatures
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          delete-untagged: true
          delete-orphaned-images: true
          older-than: ${{ inputs.older-than }}
          validate: true
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      # ── Repair (opt-in, off by default) ─────────────────────────────────────
      # A ghost image is an index whose platform children are ALL gone; a
      # partial image is one where only some are. Both are unpullable, and both
      # usually still carry a tag — including production tags like latest or
      # 0.2.9. Deleting them removes the tag from ghcr entirely, which is why
      # this is opt-in and not part of the weekly run: the standing rule is that
      # production images are never deleted automatically.
      #
      # Leaving them in place costs nothing. Rebuilding under the same tag
      # replaces the index, the dead one becomes untagged, and the integrity
      # step above collects it on the next pass.
      #
      # TWO steps, not one. In cleanup-orchestrator.ts the check reads
      # `if (deletePartialImages) {...} else if (deleteGhostImages) {...}`, and
      # findPartialImages() deliberately excludes the all-children-missing case
      # because that is ghost's job. Setting both in one step therefore silences
      # ghost detection completely — the earlier version of this file did that
      # and swept up nothing while appearing to be configured for it.
      - name: Repair - partial images
        if: inputs.repair-broken-images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          delete-partial-images: true
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Repair - ghost images
        if: inputs.repair-broken-images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          delete-ghost-images: true
          older-than: ${{ inputs.older-than }}
          validate: true
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Image cleanup"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Package | \`${{ inputs.image-name }}\` |"
            echo "| Keep per set | ${{ inputs.keep-n }} (dev) + ${{ inputs.keep-n }} (pr) |"
            echo "| Minimum age to delete | ${{ inputs.older-than }} |"
            echo "| Untouchable tags | \`${{ inputs.exclude-tags }}\` |"
            echo "| Repair broken images | ${{ inputs.repair-broken-images }} |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
