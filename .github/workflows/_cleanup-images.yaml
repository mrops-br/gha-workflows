name: Cleanup Container Images

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE WAS REWRITTEN
#
# The previous version used actions/delete-package-versions in TWO independent
# passes over the same package: one job preserved by tag (protect-semver,
# custom-ignore-pattern) and another deleted everything untagged
# (delete-only-untagged-versions: true, min-versions-to-keep: 0).
#
# In a multi-architecture image ONLY THE INDEX carries the tag. The per-platform
# manifests are package versions with no tag at all — that is OCI by design. So
# the second pass deleted exactly the children the first believed it was
# protecting, leaving the tag pointing at nothing.
#
# Measured against ghcr on 2026-08-25: runner-base with tags latest, 0, 0.2 and
# 0.2.9 — all covered by protect-semver: true — and every one resolving to a
# linux/amd64 child returning HTTP 404. Production images were protected and
# destroyed at the same time.
#
# The defect was STRUCTURAL: two passes that cannot see each other. There was no
# parameter to tune. The fix is a single pass by an action that understands
# manifest lists, and that also handles cosign signatures, which are separate
# package versions and were being orphaned.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Package name on ghcr, without the owner'
        required: true
        type: string
      owner:
        description: 'Package owner. Empty means the calling repository owner'
        required: false
        type: string
        default: ''
      keep-n:
        description: 'How many images to keep in EACH set (dev and pr), newest first'
        required: false
        type: number
        default: 3
      older-than:
        description: 'Nothing is deleted before this age. Applies to every step'
        required: false
        type: string
        default: '14 days'
      exclude-tags:
        # No nested quantifier: the action rejects `(\.\d+)*` with a ReDoS
        # heuristic. `[0-9][0-9.]*` covers 0, 0.2, 0.2.9 and v1.2.3 just the
        # same, with a single quantifier.
        description: 'Regex of untouchable tags. Takes priority over every other rule'
        required: false
        type: string
        default: '^(latest|dev-latest|v?[0-9][0-9.]*)$'
      clean-broken-images:
        description: 'Remove already broken indexes (ghost/partial) and orphaned signatures'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner'
        required: false
        type: string
        default: 'ubuntu-latest'
      dry-run:
        description: 'Only report what would be deleted, delete nothing'
        required: false
        type: boolean
        default: false
      log-level:
        description: 'error | warn | info | debug'
        required: false
        type: string
        default: 'info'

jobs:
  cleanup:
    name: Cleanup Images
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      # ── Retention ───────────────────────────────────────────────────────────
      # Two steps because keep-n-tagged counts within the set delete-tags
      # selects. In a single step, "keep three" would keep the three newest
      # across dev AND pr combined, which in practice deletes every pr image
      # whenever three develop builds are recent.
      #
      # The two sets are disjoint (dev-* and pr-*), so this is still a coherent
      # reading of the graph — unlike the "tagged versus untagged" split that
      # broke everything.
      - name: Retention - develop builds
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          use-regex: true
          # 7 to 40 hex: the real tags carry the full commit sha. The previous
          # pattern demanded exactly seven and therefore never matched anything.
          delete-tags: '^dev-[0-9a-f]{7,40}$'
          exclude-tags: ${{ inputs.exclude-tags }}
          keep-n-tagged: ${{ inputs.keep-n }}
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Retention - pull request builds
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          use-regex: true
          delete-tags: '^pr-[0-9]+$'
          exclude-tags: ${{ inputs.exclude-tags }}
          keep-n-tagged: ${{ inputs.keep-n }}
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      # ── Integrity ───────────────────────────────────────────────────────────
      # This is where the real difference lives. delete-untagged is only safe
      # because this action resolves the index first: a child of a preserved
      # image is not "untagged" to it, it is a referenced manifest.
      #
      # delete-ghost-images and delete-partial-images clean up the dead pointers
      # the previous implementation left behind.
      #
      # There is deliberately NO exclude-tags here: a ghost image cannot be
      # pulled by definition, so preserving a tag that points at a missing
      # manifest only keeps the lie in place.
      #
      # validate checks afterwards that every referenced digest is present. It
      # is the guard against this file repeating the mistake it came to fix.
      - name: Integrity - untagged, ghost, partial and orphaned signatures
        if: inputs.clean-broken-images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          older-than: ${{ inputs.older-than }}
          validate: true
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Image cleanup"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Package | \`${{ inputs.image-name }}\` |"
            echo "| Keep per set | ${{ inputs.keep-n }} (dev) + ${{ inputs.keep-n }} (pr) |"
            echo "| Minimum age to delete | ${{ inputs.older-than }} |"
            echo "| Untouchable tags | \`${{ inputs.exclude-tags }}\` |"
            echo "| Clean broken images | ${{ inputs.clean-broken-images }} |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
