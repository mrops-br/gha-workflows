name: Cleanup Container Images

# ─────────────────────────────────────────────────────────────────────────────
# POR QUE ESTE ARQUIVO FOI REESCRITO
#
# A versao anterior usava `actions/delete-package-versions` em DUAS passagens
# independentes sobre o mesmo pacote: um job preservava por tag
# (protect-semver, custom-ignore-pattern) e outro apagava tudo que nao tinha
# tag (delete-only-untagged-versions: true, min-versions-to-keep: 0).
#
# Numa imagem multi-arquitetura, SO O INDICE carrega a tag. Os manifestos por
# plataforma sao package versions sem tag nenhuma — e assim por construcao do
# OCI. Entao a segunda passagem apagava exatamente os filhos que a primeira
# achava estar protegendo. Sobrava a tag apontando para nada.
#
# Medido no ghcr em 25/08/2026: `runner-base` com as tags `latest`, `0`, `0.2`
# e `0.2.9` — todas cobertas por `protect-semver: true` — e todas com o filho
# linux/amd64 devolvendo HTTP 404. As imagens de producao estavam protegidas e
# destruidas ao mesmo tempo.
#
# O defeito era ESTRUTURAL: duas passagens que nao se enxergam. Nao havia
# parametro a ajustar. A correcao e uma passagem so, feita por uma acao que
# entende manifest list — e que de quebra sabe lidar com as assinaturas cosign,
# que tambem sao versoes separadas do pacote.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Nome do pacote no ghcr (sem o owner)'
        required: true
        type: string
      owner:
        description: 'Dono do pacote. Vazio = owner do repositorio chamador'
        required: false
        type: string
        default: ''
      keep-n:
        description: 'Quantas imagens manter em CADA conjunto (dev e pr), da mais nova para a mais velha'
        required: false
        type: number
        default: 3
      older-than:
        description: 'Nada e apagado antes desta idade. Vale para todos os passos'
        required: false
        type: string
        default: '14 days'
      exclude-tags:
        description: 'Regex de tags intocaveis. Tem prioridade sobre qualquer outra regra'
        required: false
        type: string
        default: '^(latest|dev-latest|v?\d+(\.\d+)*)$'
      clean-broken-images:
        description: 'Remover indices ja quebrados (fantasmas/parciais) e assinaturas orfas'
        required: false
        type: boolean
        default: true
      runner:
        description: 'Runner'
        required: false
        type: string
        default: 'ubuntu-latest'
      dry-run:
        description: 'So mostra o que faria, sem apagar nada'
        required: false
        type: boolean
        default: false
      log-level:
        description: 'error | warn | info | debug'
        required: false
        type: string
        default: 'info'

jobs:
  cleanup:
    name: Cleanup Images
    runs-on: ${{ inputs.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      # ── Retencao ────────────────────────────────────────────────────────────
      # Dois passos porque `keep-n-tagged` conta dentro do conjunto que
      # `delete-tags` seleciona. Num passo so, "manter 3" manteria as 3 mais
      # novas entre dev E pr misturados — o que na pratica apagaria todos os pr
      # sempre que houvesse tres builds de develop recentes.
      #
      # Os dois conjuntos sao disjuntos (`dev-*` e `pr-*`), entao continuam
      # sendo uma passagem coerente sobre o grafo — ao contrario do
      # "tags versus sem-tag" que quebrava tudo.
      - name: Retencao — builds de develop
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          use-regex: true
          delete-tags: '^dev-[0-9a-f]{7,40}$'
          exclude-tags: ${{ inputs.exclude-tags }}
          keep-n-tagged: ${{ inputs.keep-n }}
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Retencao — builds de pull request
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          use-regex: true
          delete-tags: '^pr-[0-9]+$'
          exclude-tags: ${{ inputs.exclude-tags }}
          keep-n-tagged: ${{ inputs.keep-n }}
          older-than: ${{ inputs.older-than }}
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      # ── Integridade ─────────────────────────────────────────────────────────
      # Aqui mora a diferenca de verdade. `delete-untagged` so e seguro porque
      # esta acao resolve o indice antes: filho de uma imagem preservada nao e
      # "sem tag" aos olhos dela, e sim um manifesto referenciado.
      #
      # `delete-ghost-images` e `delete-partial-images` limpam os ponteiros
      # mortos que a implementacao anterior deixou para tras.
      #
      # NAO ha `exclude-tags` neste passo, de proposito: uma imagem fantasma e
      # inutilizavel por definicao — nao ha o que preservar numa tag que aponta
      # para manifesto inexistente. Preserva-la so mantem a mentira no lugar.
      #
      # `validate` confere no fim que todo digest referenciado existe. E a rede
      # de seguranca contra este arquivo repetir o erro que veio consertar.
      - name: Integridade — sem tag, fantasmas, parciais e assinaturas orfas
        if: inputs.clean-broken-images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ inputs.owner || github.repository_owner }}
          packages: ${{ inputs.image-name }}
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          older-than: ${{ inputs.older-than }}
          validate: true
          dry-run: ${{ inputs.dry-run }}
          log-level: ${{ inputs.log-level }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Limpeza de imagens"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Pacote | \`${{ inputs.image-name }}\` |"
            echo "| Manter por conjunto | ${{ inputs.keep-n }} (dev) + ${{ inputs.keep-n }} (pr) |"
            echo "| Idade minima para apagar | ${{ inputs.older-than }} |"
            echo "| Tags intocaveis | \`${{ inputs.exclude-tags }}\` |"
            echo "| Limpar imagens quebradas | ${{ inputs.clean-broken-images }} |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
