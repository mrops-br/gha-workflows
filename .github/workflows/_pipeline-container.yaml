name: Pipeline - Container Image
description: Complete CI/CD pipeline for container-only repositories (like gha-runner-images)

on:
  workflow_call:
    inputs:
      # Image configuration
      image-name:
        description: 'Image name (without registry prefix, e.g., org/runner-base)'
        required: true
        type: string
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      context:
        description: 'Build context directory'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64'

      # CI options
      enable-lint-dockerfile:
        description: 'Enable Dockerfile linting'
        required: false
        type: boolean
        default: true
      dockerfile-failure-threshold:
        description: 'Dockerfile lint failure threshold'
        required: false
        type: string
        default: 'warning'

      # Build options
      enable-signing:
        description: 'Enable image signing with cosign'
        required: false
        type: boolean
        default: true
      enable-scanning:
        description: 'Enable vulnerability scanning'
        required: false
        type: boolean
        default: true
      scan-severity:
        description: 'Vulnerability scan severity'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      build-args:
        description: 'Docker build arguments (multiline)'
        required: false
        type: string
        default: ''

      # Release options (for main branch)
      enable-auto-release:
        description: 'Enable automatic release on merge to main'
        required: false
        type: boolean
        default: true
      enable-changelog:
        description: 'Enable changelog generation'
        required: false
        type: boolean
        default: false
      changelog-config:
        description: 'Path to git-cliff config'
        required: false
        type: string
        default: 'cliff.toml'

      # Runners
      lint-runner:
        description: 'Runner for lint jobs'
        required: false
        type: string
        default: 'ubuntu-latest'
      build-runner:
        description: 'Runner for build and deploy jobs'
        required: false
        type: string
        default: 'shared-runners'

      # --- Deployment (opt-in) ---
      #
      # Off by default so container repositories that only publish an image --
      # runner images, base images -- keep the pipeline they already have.
      # Turning it on makes this workflow behave like the golang and nodejs
      # ones: release/* and hotfix/* deploy to staging, and a merge to main
      # deploys to production after the release.
      enable-deploy:
        description: 'Enable the ArgoCD deployment jobs'
        required: false
        type: boolean
        default: false
      app-name:
        description: 'Application name, e.g. keycloak (required when enable-deploy)'
        required: false
        type: string
        default: ''
      project-name:
        description: 'Project name; selects gitops-<project-name> and the ArgoCD app prefix'
        required: false
        type: string
        default: ''
      deploy-environment:
        description: 'Environment to deploy (auto-detected from the branch if not set)'
        required: false
        type: string
        default: ''

jobs:
  # Step 1: Lint Dockerfile
  lint:
    name: Lint Dockerfile
    if: inputs.enable-lint-dockerfile
    runs-on: ${{ inputs.lint-runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: mrops-br/gha-workflows/.github/actions/quality/lint-dockerfile@main
        with:
          dockerfile: ${{ inputs.dockerfile }}
          failure-threshold: ${{ inputs.dockerfile-failure-threshold }}

  # Step 2: Detect Git Flow context
  detect-context:
    name: Detect Context
    uses: mrops-br/gha-workflows/.github/workflows/_detect-gitflow.yaml@main
    with:
      runner: ubuntu-latest

  # Step 3: Build, Sign, Scan Docker Image
  build:
    name: Build Image
    needs: [lint, detect-context]
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.detect-context.outputs.is-main-merge == 'false'
    uses: mrops-br/gha-workflows/.github/workflows/_build-docker.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      # Required by the `build` job in _build-docker.yaml, for Trivy.
      #
      # Permissions only NARROW as they descend the workflow chain. Without this
      # line the level below asks for `actions: read`, never receives it, and
      # GitHub refuses the whole run with startup_failure - no job created and
      # no log at all. Granting it in the calling repository does not help: this
      # is the layer that cuts it off.
      actions: read
    with:
      image-name: ${{ inputs.image-name }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
      registry: ${{ inputs.registry }}
      platforms: ${{ inputs.platforms }}
      push: ${{ needs.detect-context.outputs.should-push == 'true' }}
      build-args: ${{ inputs.build-args }}
      enable-signing: ${{ inputs.enable-signing }}
      enable-scanning: ${{ inputs.enable-scanning }}
      scan-severity: ${{ inputs.scan-severity }}
      runner: ${{ inputs.build-runner }}
    secrets: inherit

  # Step 4: Determine environment for deployment
  determine-env:
    name: Determine Environment
    needs: [build, detect-context]
    if: |
      always() &&
      inputs.enable-deploy &&
      needs.build.result == 'success' &&
      needs.detect-context.outputs.should-push == 'true'
    uses: mrops-br/gha-workflows/.github/workflows/_determine-deployment-env.yaml@main
    with:
      deploy-environment: ${{ inputs.deploy-environment }}
      branch-type: ${{ needs.detect-context.outputs.branch-type }}
      is-main-merge: ${{ needs.detect-context.outputs.is-main-merge }}
      should-push: ${{ needs.detect-context.outputs.should-push }}
      image-tags: ${{ needs.build.outputs.image-tags }}
      event-name: ${{ github.event_name }}
      github-ref: ${{ github.ref }}
      github-base-ref: ${{ github.base_ref }}
      github-sha: ${{ github.sha }}

  # Step 5: Deploy to Environment (staging only; production runs after release)
  deploy:
    name: Deploy to ${{ needs.determine-env.outputs.environment }}
    needs: [build, detect-context, determine-env]
    if: |
      inputs.enable-deploy &&
      needs.determine-env.outputs.should-deploy == 'true' &&
      needs.determine-env.outputs.environment != ''
    uses: mrops-br/gha-workflows/.github/workflows/_deploy-argocd.yaml@main
    with:
      app-name: ${{ inputs.app-name }}
      argocd-app-name: ${{ inputs.project-name }}-${{ needs.determine-env.outputs.environment }}-${{ inputs.app-name }}
      image-name: ${{ inputs.image-name }}
      environment: ${{ needs.determine-env.outputs.environment }}
      environment-name: ${{ needs.determine-env.outputs.environment-name }}
      gitops-repo: ${{ github.repository_owner }}/gitops-${{ inputs.project-name }}
      image-tag: ${{ needs.determine-env.outputs.image-tag }}
      registry: ${{ inputs.registry }}
      wait-for-sync: true
      runner: ${{ inputs.build-runner }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      CICD_USERNAME: ${{ secrets.CICD_USERNAME }}
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}

  # Step 6: Release (on main branch merge)
  release:
    name: Release
    needs: [detect-context]
    if: |
      needs.detect-context.outputs.is-main-merge == 'true' &&
      inputs.enable-auto-release
    uses: mrops-br/gha-workflows/.github/workflows/_gitflow-release.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
    with:
      auto-detect-version: true
      enable-docker-retag: true
      docker-registry: ${{ inputs.registry }}
      docker-image-name: ${{ inputs.image-name }}
      docker-semver-tags: true
      enable-changelog: ${{ inputs.enable-changelog }}
      changelog-config: ${{ inputs.changelog-config }}
      enable-git-tag: true
      enable-merge-back: true
      runner: ${{ inputs.lint-runner }}

  # Step 7: Deploy to Production (after a successful release)
  deploy-production:
    name: Deploy to Production
    needs: [detect-context, release]
    if: |
      inputs.enable-deploy &&
      needs.detect-context.outputs.is-main-merge == 'true' &&
      needs.release.result == 'success'
    uses: mrops-br/gha-workflows/.github/workflows/_deploy-argocd.yaml@main
    with:
      app-name: ${{ inputs.app-name }}
      argocd-app-name: ${{ inputs.project-name }}-prd-${{ inputs.app-name }}
      image-name: ${{ inputs.image-name }}
      environment: prd
      environment-name: production
      gitops-repo: ${{ github.repository_owner }}/gitops-${{ inputs.project-name }}
      image-tag: ${{ needs.release.outputs.version }}
      registry: ${{ inputs.registry }}
      wait-for-sync: true
      runner: ${{ inputs.build-runner }}
    secrets:
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      CICD_USERNAME: ${{ secrets.CICD_USERNAME }}
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}

  # Summary
  summary:
    name: Pipeline Summary
    needs: [lint, detect-context, build, determine-env, deploy, release, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Container Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ inputs.registry }}/${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch Type**: ${{ needs.detect-context.outputs.branch-type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.enable-deploy }}" == "true" ]]; then
            echo "| Deploy (${{ needs.determine-env.outputs.environment }}) | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Deploy (prd) | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.detect-context.outputs.is-main-merge }}" == "true" ]]; then
            if [[ "${{ needs.release.result }}" == "success" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ **Release completed successfully!**" >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ **Release failed**" >> $GITHUB_STEP_SUMMARY
            fi
          elif [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.detect-context.outputs.should-push }}" == "true" ]]; then
              echo "✅ **Build and push completed**" >> $GITHUB_STEP_SUMMARY
              echo "**Tags**: \`${{ needs.build.outputs.image-tags-csv }}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **Build validated (not pushed)**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
