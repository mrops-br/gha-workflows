name: ArgoCD Sync
description: Trigger ArgoCD sync and optionally wait for deployment

inputs:
  argocd-server:
    description: 'ArgoCD server URL (e.g., argocd.example.com)'
    required: true
  argocd-token:
    description: 'ArgoCD auth token'
    required: true
  app-name:
    description: 'ArgoCD application name'
    required: true
  wait:
    description: 'Wait for sync to complete'
    required: false
    default: 'true'
  timeout:
    description: 'Timeout for waiting in seconds'
    required: false
    default: '300'
  prune:
    description: 'Prune resources during sync'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install ArgoCD CLI
      shell: bash
      run: |
        # Install ArgoCD CLI if not available (when not using runner-base image)
        if ! command -v argocd &> /dev/null; then
          echo "ArgoCD CLI not found, installing..."
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 /tmp/argocd /usr/local/bin/argocd
          rm /tmp/argocd
        else
          echo "ArgoCD CLI already available"
        fi
        argocd version --client

    - name: Verify ArgoCD Credentials
      shell: bash
      env:
        ARGOCD_SERVER: ${{ inputs.argocd-server }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.argocd-token }}
        ARGOCD_OPTS: "--plaintext"
        APP_NAME: ${{ inputs.app-name }}
      run: |
        # Validate ARGOCD_SERVER and prove the session actually works.
        #
        # `argocd account get-user-info` is NOT a credential check. It exits 0
        # even when the server rejects the session, printing only
        # "Logged In: false". The previous version of this step ran exactly
        # that and passed, so a token signed by a different ArgoCD sailed
        # through and blew up two steps later in `app sync`, reported as a
        # runner failure instead of an auth failure.
        #
        # Measured against argocd v3.2.0:
        #   no token                     -> "Logged In: false", exit 0
        #   wrong signature              -> "Logged In: false", exit 0
        #   valid token                  -> "Logged In: true",  exit 0
        #   `argocd app get` unreadable  -> exit 20
        #   `argocd app get` readable    -> exit 0
        #
        # So this gates on two things: the session is recognised, and the token
        # can actually read the application it is about to sync. The second
        # also covers the case of a valid token whose RBAC does not reach this
        # app - which would fail the sync just the same.
        set -o pipefail

        if [ -z "$ARGOCD_SERVER" ]; then
          echo "ERROR: ARGOCD_SERVER is empty"
          exit 1
        fi

        echo "Verifying ArgoCD credentials against $ARGOCD_SERVER ..."

        if ! USER_INFO="$(argocd account get-user-info 2>&1)"; then
          echo "ERROR: could not reach ArgoCD at $ARGOCD_SERVER"
          echo "$USER_INFO"
          exit 1
        fi
        echo "$USER_INFO"

        if ! grep -qi '^Logged In:[[:space:]]*true' <<<"$USER_INFO"; then
          echo "ERROR: ArgoCD did not accept the token."
          echo "  The session is anonymous, so every later step would fail."
          echo "  Usual causes: ARGOCD_AUTH_TOKEN is empty, expired, revoked,"
          echo "  or was issued by a DIFFERENT ArgoCD instance - a token is"
          echo "  signed with that server's key, so pointing at another"
          echo "  cluster gives 'token signature is invalid'."
          exit 1
        fi

        # -o json, not -o name: `argocd app get` accepts only
        # json|yaml|wide|tree. `argocd app list` does accept `name`, which is
        # what made this look reasonable - they are different commands.
        if ! APP_CHECK="$(argocd app get "$APP_NAME" -o json 2>&1 >/dev/null)"; then
          echo "ERROR: authenticated, but cannot read application '$APP_NAME'."
          echo "  Either the application does not exist on this ArgoCD, or the"
          echo "  account lacks RBAC for it. The sync below would fail anyway."
          echo "$APP_CHECK"
          exit 1
        fi
        echo "Credentials OK - '$APP_NAME' is readable."

    - name: Sync application
      shell: bash
      env:
        ARGOCD_SERVER: ${{ inputs.argocd-server }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.argocd-token }}
        ARGOCD_OPTS: "--plaintext"
      run: |
        # Sync ArgoCD Application
        SYNC_ARGS=""
        if [[ "${{ inputs.prune }}" == "true" ]]; then
          SYNC_ARGS="--prune"
        fi

        echo "Syncing ArgoCD application: ${{ inputs.app-name }}"
        argocd app sync ${{ inputs.app-name }} $SYNC_ARGS

    - name: Wait for sync
      if: inputs.wait == 'true'
      shell: bash
      env:
        ARGOCD_SERVER: ${{ inputs.argocd-server }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.argocd-token }}
        ARGOCD_OPTS: "--plaintext"
      run: |
        # Wait ArgoCD Application sync to finish
        echo "Waiting for sync to complete (timeout: ${{ inputs.timeout }})..."
        argocd app wait ${{ inputs.app-name }} \
          --health \
          --timeout ${{ inputs.timeout }}

        echo "✅ Application synced and healthy"

    - name: Get application status
      if: always()
      shell: bash
      env:
        ARGOCD_SERVER: ${{ inputs.argocd-server }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.argocd-token }}
        ARGOCD_OPTS: "--plaintext"
      run: |
        # Get ArgoCD Application status after sync
        echo "Application status:"
        argocd app get ${{ inputs.app-name }}
