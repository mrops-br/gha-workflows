name: Generate Git Flow Tags
description: Generate image tags based on Git Flow branch and event type

inputs:
  branch-type:
    description: 'Branch type (main, develop, release, hotfix, feature, other)'
    required: true
  version:
    description: 'Version number (e.g., 1.2.3)'
    required: false
    default: ''
  sha:
    description: 'Git commit SHA (short)'
    required: true
  event-name:
    description: 'GitHub event name'
    required: true
  pr-number:
    description: 'Pull request number (if applicable)'
    required: false
    default: ''

outputs:
  tags:
    description: 'Comma-separated list of tags'
    value: ${{ steps.generate.outputs.tags }}
  primary-tag:
    description: 'Primary tag for this build'
    value: ${{ steps.generate.outputs.primary-tag }}
  image-tag:
    description: 'Image tag for deployment (alias for primary-tag)'
    value: ${{ steps.generate.outputs.primary-tag }}

runs:
  using: composite
  steps:
    - name: Generate tags
      id: generate
      shell: bash
      run: |
        TAGS=()
        PRIMARY_TAG=""
        BRANCH_TYPE="${{ inputs.branch-type }}"
        VERSION="${{ inputs.version }}"
        SHA="${{ inputs.sha }}"
        EVENT="${{ inputs.event-name }}"

        # Callers pass the full 40-character sha even though the input is
        # described as short, so shorten it here rather than at every call site.
        SHORT_SHA="${SHA:0:7}"
        PR_NUMBER="${{ inputs.pr-number }}"

        echo "Generating tags for:"
        echo "  Branch type: $BRANCH_TYPE"
        echo "  Version: $VERSION"
        echo "  SHA: $SHA (short: $SHORT_SHA)"
        echo "  Event: $EVENT"

        case "$BRANCH_TYPE" in
          main)
            if [ -n "$VERSION" ]; then
              # Main branch with version (after release/hotfix merge)
              TAGS+=("$VERSION")
              TAGS+=("latest")
              PRIMARY_TAG="$VERSION"
              echo "✅ Main branch with version: $VERSION, latest"
            else
              # Main branch without version
              TAGS+=("$SHA")
              TAGS+=("latest")
              PRIMARY_TAG="latest"
              echo "ℹ️ Main branch without version: latest, $SHA"
            fi
            ;;

          develop)
            TAGS+=("dev-latest")
            TAGS+=("dev-$SHA")
            PRIMARY_TAG="dev-latest"
            echo "✅ Develop branch: dev-latest, dev-$SHA"
            ;;

          release)
            if [ -n "$VERSION" ]; then
              # The per-commit tag is what gets deployed. A moving tag makes the
              # GitOps step rewrite the value it already found, which produces no
              # commit, so ArgoCD syncs an identical manifest and the pod keeps
              # the previous image while every step reports success.
              TAGS+=("${VERSION}-rc-${SHORT_SHA}")
              TAGS+=("${VERSION}-rc-latest")
              PRIMARY_TAG="${VERSION}-rc-${SHORT_SHA}"
              echo "✅ Release branch: ${VERSION}-rc-${SHORT_SHA}, ${VERSION}-rc-latest"
            else
              echo "❌ Release branch without version"
              exit 1
            fi
            ;;

          hotfix)
            if [ -n "$VERSION" ]; then
              TAGS+=("${VERSION}-hotfix-rc-${SHORT_SHA}")
              TAGS+=("${VERSION}-hotfix-rc-latest")
              PRIMARY_TAG="${VERSION}-hotfix-rc-${SHORT_SHA}"
              echo "✅ Hotfix branch: ${VERSION}-hotfix-rc-${SHORT_SHA}, ${VERSION}-hotfix-rc-latest"
            else
              echo "❌ Hotfix branch without version"
              exit 1
            fi
            ;;

          feature)
            if [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
              TAGS+=("pr-$PR_NUMBER")
              PRIMARY_TAG="pr-$PR_NUMBER"
              echo "ℹ️ Feature PR: pr-$PR_NUMBER"
            else
              TAGS+=("$SHA")
              PRIMARY_TAG="$SHA"
              echo "ℹ️ Feature branch: $SHA"
            fi
            ;;

          *)
            TAGS+=("$SHA")
            PRIMARY_TAG="$SHA"
            echo "ℹ️ Other branch: $SHA"
            ;;
        esac

        # Convert array to comma-separated string
        TAGS_CSV=$(IFS=,; echo "${TAGS[*]}")

        echo "tags=$TAGS_CSV" >> $GITHUB_OUTPUT
        echo "primary-tag=$PRIMARY_TAG" >> $GITHUB_OUTPUT

        # Summary
        echo "### Generated Tags" >> $GITHUB_STEP_SUMMARY
        echo "- **Primary**: \`$PRIMARY_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "- **All**: \`$TAGS_CSV\`" >> $GITHUB_STEP_SUMMARY
