# Example: container image cleanup
#
# Copy to .github/workflows/cleanup-images.yaml in the target repository and
# change image-name. Everything else has a sane default in the shared workflow.
#
# What it does, per package:
#   - keeps the 3 newest dev-<sha> builds and the 3 newest pr-<n> builds
#   - never touches latest, dev-latest or any semver tag
#   - deletes nothing younger than 14 days, in any step
#   - removes top-level untagged images and orphaned cosign signatures
#   - validates afterwards and WARNS about indexes with missing children
#
# It does NOT delete broken-but-tagged images. Rebuilding under the same tag
# replaces them, and the next run collects the leftover. To sweep them anyway,
# dispatch manually with repair-broken-images - that step destroys tags, so run
# it in dry-run first.

name: Cleanup Container Images

on:
  schedule:
    # Sunday, 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only report what would be deleted'
        required: false
        type: boolean
        default: true
      repair-broken-images:
        description: 'Also delete already-broken indexes. DESTROYS TAGS - run in dry-run first'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup Images
    uses: mrops-br/gha-workflows/.github/workflows/_cleanup-images.yaml@main
    permissions:
      packages: write
      contents: read
    with:
      image-name: my-app
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
      repair-broken-images: ${{ github.event_name == 'workflow_dispatch' && inputs.repair-broken-images || false }}

      # Optional overrides:
      #   owner:        'mrops-br'   package owner, defaults to this repo's owner
      #   keep-n:       3            per set (dev and pr are counted separately)
      #   older-than:   '14 days'    minimum age before anything is deleted
      #   exclude-tags: '^(latest|dev-latest|v?[0-9][0-9.]*)$'
      #   log-level:    'debug'
